name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The gate compares skills/, hooks/ and agents/ with main to see that the version moved.
      - run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # shellcheck, codespell and ruff run through uvx at pinned versions.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: bash scripts/check.sh
