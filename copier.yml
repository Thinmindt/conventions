# The template every project is generated from, and updated from (README, "In a project").
# The template's files are under template/; the plugin's are everything else.
_min_copier_version: "9.18"
_subdirectory: template
_skip_if_exists:
  - scripts/private_terms.sh
_tasks:
  - "git rev-parse --git-dir >/dev/null 2>&1 && git config core.hooksPath scripts/githooks || true"
  - "grep -qx '.private-terms' .gitignore 2>/dev/null || echo '.private-terms' >>.gitignore"
  # The type checker runs inside the project's environment, so it is a pinned dev dependency.
  - command: "[ -f pyproject.toml ] || uv init --bare"
    when: "{{ type_checker != 'none' }}"
  - command: "uv add --quiet --dev '{{ type_checker }}=={{ type_checker_versions[type_checker] }}'"
    when: "{{ type_checker != 'none' }}"

project_name:
  type: str
  help: The project's name, as its README gives it

languages:
  type: str
  help: The languages in the project (space to select)
  multiselect: true
  choices:
    - python
    - csharp
    - c-cpp
    - javascript
  default: [python]

type_checker:
  type: str
  help: The Python type checker (python-style, Tooling; adopt by measuring what it flags)
  choices:
    - none
    - ty
    - pyright
    - mypy
  default: none
  when: "{{ 'python' in languages }}"

type_checker_versions:
  type: yaml
  when: false
  default:
    ty: 0.0.84
    pyright: 1.1.408
    mypy: 1.19.1

hardware_module:
  type: str
  help: The one module that may import the device library, e.g. src/camera.py (empty for none)
  default: ""
  when: "{{ 'python' in languages }}"

device_library:
  type: str
  help: The device library that stays behind that boundary, e.g. picamera2
  default: ""
  when: "{{ 'python' in languages and hardware_module }}"

private_terms:
  type: bool
  help: Does the project print private terms of its own from scripts/private_terms.sh?
  default: false
